[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "skill-router-auditor"
version = "0.1.0"
description = "Audit large Agent skill catalogs for routing quality, conflicts, and missing negative triggers."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
  { name = "Open Source Maintainers" }
]
keywords = [
  "agent",
  "skills",
  "codex",
  "routing",
  "prompt-engineering",
  "llm",
  "open-source-maintenance"
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Text Processing :: Linguistic"
]
dependencies = []

[project.scripts]
skill-router-audit = "skill_router_auditor.cli:main"

[project.urls]
Homepage = "https://github.com/t531504845-ai/skill-router-auditor"
Issues = "https://github.com/t531504845-ai/skill-router-auditor/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]
